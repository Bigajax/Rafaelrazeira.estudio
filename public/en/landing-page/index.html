<!-- A página tem irmã em inglês (/en/landing-page, 11/09/2026): canonical
     e os dois hreflang dizem ao Google que são a mesma página em dois
     idiomas, e o x-default é o português, que é a URL das campanhas. -->
<link rel="canonical" href="https://rafaelrazeira.com.br/en/landing-page" />
<link rel="alternate" hreflang="pt-BR" href="https://rafaelrazeira.com.br/landing-page" />
<link rel="alternate" hreflang="en" href="https://rafaelrazeira.com.br/en/landing-page" />

<!-- ============================================================
     A /en/landing-page (11/09/2026) é a IRMÃ em inglês da /landing-page:
     mesmo CSS, mesmos módulos, mesmo main-lp.js. O que muda é o que
     js/config.js escolhe pelo caminho da URL (CONFIG_LP_EN por cima do
     CONFIG_LP, e o dicionário T dos rótulos fixos) e o <head> daqui.
     Os caminhos absolutos (/css, /js, /assets) caem em public/estudio/*
     pelos rewrites do next.config.ts, como na pt. Tudo o que é decisão
     de layout está comentado na public/landing-page/index.html.
     ============================================================ -->

<!-- ============================================================
     ESTA PÁGINA NÃO TEM TELA DE CARREGAMENTO, e não é esquecimento.

     O loader que a /estudio usa cobre a tela até o evento `load` (que
     espera todas as imagens não-lazy e as fontes) e só então começa a
     se desfazer numa grade de quadrados: num celular de 390x844 são 20
     fileiras a 55ms cada, ou seja, mais 1,5s DEPOIS de a espera acabar.

     A /vitrine-digital já pagou essa conta com dado: lá o rito custava
     um piso de ~2s em conexão boa e ~3,5s no 4G, numa sessão mediana de
     8,6 segundos. Perto de 40% da visita gasta olhando uma logo. Ele foi
     removido de lá em 05/08 por isso.

     Esta página tem exatamente o mesmo perfil de tráfego: anúncio pago
     da Meta, quase tudo 4G, muita gente pelo navegador interno do
     Instagram. Ninguém clicou no anúncio para ver uma abertura.

     A /estudio continua com o loader: lá o visitante já conhece a marca
     ou chegou por vontade própria.
     ============================================================ -->
