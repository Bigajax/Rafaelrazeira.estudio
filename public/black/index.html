<!-- ============================================================
     A BLACK (04/11/2026), pedido do Rafael: só o topo, na identidade do
     banner preto e dourado, com o pagamento na própria página. É o link
     do botão da transmissão comercial do WhatsApp para as amostras.
     Os valores moram em lib/propostas.ts ("black-799"); aqui só exibe.
     R$ 799 inteiros na frente (Pix ou cartão em até 12x COM os juros do
     Mercado Pago: nunca escrever "sem juros" nem a parcela à mão) e a
     condição normal ao lado, como no banner. Vale até 30/11; em 01/12,
     tirar do ar ou decidir com o Rafael.
     A arte é o próprio banner recortado (public/assets/black): o letreiro
     derretido não existe como fonte, e redesenhar em CSS ficaria pior.
     ============================================================ -->

<link rel="icon" type="image/png" href="/assets/favicon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;900&family=DM+Serif+Display&display=swap" rel="stylesheet" />

<link rel="preload" as="image" href="/assets/black/arte.webp" />
<link rel="stylesheet" href="/css/proposta-checkout.css" />
<script src="/js/proposta-checkout.js" defer></script>

<style>
:root{
  --preto:#000;
  --ouro:#FDBB17;
  --ouro-escuro:#E0A200;
  --branco:#fff;
  --cinza:rgba(255,255,255,.68);
  --linha:rgba(253,187,23,.45);
  --pad:16px;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
html,body{margin:0;background:var(--preto);color:var(--branco);overflow-x:clip}
body{position:relative;isolation:isolate;font-family:"Archivo",system-ui,sans-serif;line-height:1.4;-webkit-font-smoothing:antialiased;min-height:100svh}

.hero{
  min-height:100svh;
  display:grid;grid-template-columns:minmax(0,1fr);justify-items:center;align-content:start;
  gap:8px;padding:0 var(--pad) 40px;
}
/* as chamas cinza do banner, em cima e embaixo */
body::before,body::after{
  content:"";position:absolute;left:0;right:0;height:180px;z-index:-1;pointer-events:none;
  background:url(/assets/black/chamas.webp) center top/auto 100% repeat-x;opacity:.9;
}
body::before{top:0}
body::after{bottom:0;transform:scaleY(-1)}

.arte{width:100%;max-width:440px;margin:0}
/* lighten: o preto da arte some e as chamas do fundo passam por trás, como no banner */
.arte img{display:block;width:100%;height:auto;mix-blend-mode:lighten}

.acao{width:100%;max-width:440px;display:grid;gap:14px}
.selo{
  justify-self:start;margin:0;padding:6px 12px;border:1px solid var(--linha);border-radius:999px;
  color:var(--ouro);font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase;
}
h1{margin:0;font-weight:900;font-size:clamp(24px,6.4vw,32px);line-height:1.08;letter-spacing:-.01em;text-wrap:balance}
h1 em{font-style:normal;color:var(--ouro)}
.linha{margin:0;color:var(--cinza);font-size:16px}

.pagar{display:grid;gap:10px;margin-top:6px}
.btn{
  -webkit-appearance:none;appearance:none;cursor:pointer;width:100%;min-height:56px;
  border-radius:999px;border:2px solid var(--ouro);padding:14px 22px;
  font:900 17px/1.15 "Archivo",system-ui,sans-serif;letter-spacing:.005em;
  transition:transform .15s ease,background-color .15s ease,color .15s ease;
}
.btn:active{transform:scale(.98)}
.btn:focus-visible,.dividir:focus-visible,.duvida:focus-visible{outline:3px solid var(--branco);outline-offset:3px}
.btn--pix{background:var(--ouro);color:var(--preto);box-shadow:0 10px 30px -10px rgba(253,187,23,.55)}
.btn--pix:hover{background:var(--ouro-escuro);border-color:var(--ouro-escuro)}
.btn--card{background:transparent;color:var(--ouro)}
.btn--card:hover{background:rgba(253,187,23,.1)}
.nota{margin:0;color:var(--cinza);font-size:13px;text-align:center}

.ou{display:flex;align-items:center;gap:12px;margin:8px 0 0;color:var(--cinza);font-family:"DM Serif Display",Georgia,serif;font-size:18px}
.ou::before,.ou::after{content:"";flex:1;height:1px;background:rgba(255,255,255,.18)}
.dividir{
  -webkit-appearance:none;appearance:none;cursor:pointer;background:none;border:0;padding:6px 0;
  color:var(--branco);font:700 16px/1.35 "Archivo",system-ui,sans-serif;text-align:center;
  text-decoration:underline;text-decoration-color:var(--linha);text-underline-offset:5px;text-decoration-thickness:2px;
}
.dividir:hover{text-decoration-color:var(--ouro)}
.duvida{display:block;margin-top:10px;color:var(--cinza);font-size:14px;text-align:center}
.duvida strong{color:var(--branco);text-decoration:underline;text-underline-offset:3px}

@media (min-width:900px){
  .hero{
    grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:center;align-content:center;
    gap:clamp(32px,5vw,80px);padding:40px clamp(32px,6vw,96px);max-width:1280px;margin:0 auto;
  }
  body::before,body::after{height:220px}
  .arte{justify-self:end;max-width:none;width:auto}
  .arte img{width:auto;max-width:100%;max-height:calc(100svh - 80px)}
  .acao{justify-self:start;max-width:460px}
  h1{font-size:clamp(32px,3.2vw,44px)}
  .linha{font-size:18px}
}
@media (prefers-reduced-motion:reduce){.btn{transition:none}.btn:active{transform:none}}
</style>
</head>
<body data-proposta="black-799">
<main class="hero" id="principal">
  <figure class="arte">
    <img src="/assets/black/arte.webp" width="916" height="1150" fetchpriority="high"
         alt="Black Friday: o site da sua loja por R$ 799 à vista no Pix, ou R$ 999 com metade pra começar e o resto na entrega" />
  </figure>

  <div class="acao">
    <p class="selo">Vale até 30/11</p>
    <h1>A vitrine da sua loja no ar, com o pedido caindo no <em>seu WhatsApp</em>.</h1>
    <p class="linha">Uma vez só, sem mensalidade.</p>

    <div class="pagar">
      <button class="btn btn--pix" type="button" data-checkout-item="avista_pix">Pagar R$ 799 no Pix</button>
      <button class="btn btn--card" type="button" data-checkout-item="avista_card">R$ 799 no cartão, em até 12x</button>
      <p class="nota">No cartão, as parcelas e os juros aparecem antes de você confirmar.</p>
    </div>

    <p class="ou">ou</p>
    <button class="dividir" type="button" data-checkout-item="entrada_pix">Prefiro dividir: R$ 500 agora no Pix e R$ 499 na entrega</button>

    <a class="duvida" href="https://wa.me/5544991246187?text=Oi%2C%20Rafael!%20Vi%20a%20Black%20e%20quero%20ver%20a%20vitrine%20da%20minha%20loja." target="_blank" rel="noopener">Ainda não viu a vitrine da sua loja? <strong>Me chama no WhatsApp</strong></a>
  </div>
</main>
</body>
</html>
