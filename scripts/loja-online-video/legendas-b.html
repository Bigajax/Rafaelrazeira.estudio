<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<title>L16-01b legendas</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700&display=swap" rel="stylesheet">
<style>
/* A legenda do L16-01b (07/11/2026): a compra no ritmo real, com uma frase por
   passo, pequena e embaixo, no estilo das legendas do Reels. Veio da pesquisa na
   Biblioteca da Meta: nenhum anúncio de loja virtual que roda há meses usa cartaz
   de texto gigante. Desenhada por tempo (render(t)), com fundo transparente. */
:root { --tinta: #14181a; }
* { box-sizing: border-box; margin: 0; }
html, body { width: 1080px; height: var(--alto); background: transparent; overflow: hidden; font-family: Inter, Arial, sans-serif; }
.leg { position: absolute; left: 90px; right: 90px; top: var(--legY); display: flex; justify-content: center; text-align: center; opacity: 0; }
.leg span { display: inline; padding: 10px 22px 12px; border-radius: 18px; background: #14181ae6; color: #fff; font-weight: 700; font-size: 54px; line-height: 1.32; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
.tag { position: absolute; left: 60px; top: var(--tagTopo); padding: 10px 20px; border-radius: 999px; background: #14181ad9; color: #fff; font: 600 28px/1 Inter, sans-serif; }
.escuro { position: absolute; inset: 0; background: var(--tinta); opacity: 0; }
.fim { position: absolute; left: 90px; right: 90px; top: var(--fimY); transform: translateY(-50%); display: grid; gap: 30px; justify-items: center; text-align: center; color: #fff; opacity: 0; }
.fim h2 { font-weight: 700; font-size: 84px; line-height: 1.05; letter-spacing: -.02em; }
.fim p { font-weight: 600; font-size: 46px; line-height: 1.3; color: #e9ecee; }
.assina { display: flex; align-items: center; gap: 18px; font: 600 34px/1.2 Inter, sans-serif; color: #fff; }
.assina img { width: 76px; height: 76px; border-radius: 18px; background: #fff; padding: 10px; }
</style></head>
<body>
<div class="escuro" id="escuro"></div>
<div id="legs"></div>
<div class="fim" id="fim">
  <h2>Eu faço a sua loja online.</h2>
  <p>Manda o @ da sua loja e eu monto uma amostra com as suas peças.</p>
  <div class="assina"><img src="MONOGRAMA" alt=""><span>rafaelrazeira.com.br</span></div>
</div>
<div class="tag">Demonstração</div>
<script>
/* [início, fim, frase], no tempo do vídeo montado (os trechos em montar-b.mjs) */
const LEG = [
  [0.2, 3.0, "Você vende roupa ou tênis pelo Instagram?"],
  [3.0, 4.6, "Olha o seu cliente comprando sozinho."],
  [4.6, 7.4, "Ele escolhe o tamanho e toca em Comprar."],
  [7.4, 10.4, "Digita o CEP"],
  [10.4, 12.6, "e escolhe o frete."],
  [12.6, 13.8, "Paga no Pix."],
  [13.8, 16.8, "Pedido pago. Mesmo com a loja fechada."],
];
const FIM = 16.8;
const box = document.getElementById("legs");
const els = LEG.map(([, , f]) => { const d = document.createElement("div"); d.className = "leg"; d.innerHTML = `<span>${f}</span>`; box.appendChild(d); return d; });
const fase = (t, a, b) => Math.min(1, Math.max(0, (t - a) / (b - a)));
window.render = t => {
  LEG.forEach(([a, b], k) => {
    /* entra em 4 quadros e sai junto com a troca, sem deslizar */
    const p = fase(t, a, a + .13) * (t < b ? 1 : 0);
    els[k].style.opacity = p;
    els[k].style.transform = `translateY(${(1 - p) * 10}px)`;
  });
  /* fundo sólido no fecho: com .9 e com .96 o "Pagamento aprovado" aparecia por trás */
  document.getElementById("escuro").style.opacity = fase(t, FIM, FIM + .25);
  const f = fase(t, FIM + .15, FIM + .4);
  document.getElementById("fim").style.opacity = f;
};
window.render(0);
</script>
</body></html>
